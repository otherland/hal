name: PR decider

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  workflow_dispatch:
    inputs:
      pr_number:
        description: Pull request number to ask about
        required: true
        type: number

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: pr-decider-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

env:
  DECIDER_MODEL: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610
  # Repository variables: DECIDER_RUNNER names a larger or GPU runner, and
  # DECIDER_DEVICE=cuda uses its GPU. Unset, it runs on ubuntu-latest's CPU.
  DECIDER_DEVICE: ${{ vars.DECIDER_DEVICE || 'cpu' }}

jobs:
  ask:
    # Skip drafts, and edits that change neither the title nor the description
    # (the only parts of an edit the decider reads).
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !github.event.pull_request.draft && (
          github.event.action != 'edited' ||
          github.event.changes.title || github.event.changes.body))
    runs-on: ${{ vars.DECIDER_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
          cache-dependency-glob: .github/decider/requirements.txt

      # Install in the background while the next steps fetch the PR and restore
      # the 3.7 GB model; "Finish installing" waits for it.
      - name: Start installing strands-decider
        run: |
          (
            if [ "$DECIDER_DEVICE" = cuda ]; then
              uv pip install --system torch -r .github/decider/requirements.txt
            else
              uv pip install --system torch --index-url https://download.pytorch.org/whl/cpu &&
              uv pip install --system -r .github/decider/requirements.txt
            fi
            echo $? > "$RUNNER_TEMP/install.rc"
          ) > "$RUNNER_TEMP/install.log" 2>&1 &

      - name: Look up the PR
        id: pr
        uses: actions/github-script@v7
        env:
          PR_NUMBER: ${{ github.event.pull_request.number || inputs.pr_number }}
        with:
          script: |
            const { data: pr } = await github.rest.pulls.get({
              ...context.repo,
              pull_number: Number(process.env.PR_NUMBER),
            });
            core.setOutput("number", pr.number);
            core.setOutput("title", pr.title);
            core.setOutput("body", pr.body ?? "");
            core.setOutput("base_sha", pr.base.sha);
            core.setOutput("head_sha", pr.head.sha);
            core.setOutput("same_repo", pr.head.repo?.full_name === `${context.repo.owner}/${context.repo.repo}`);

      # A manual run checks out the branch it was started from, so fetch the PR's commits.
      - name: Fetch the PR head
        run: git fetch --no-tags origin "refs/pull/${{ steps.pr.outputs.number }}/head"

      # Restore only: decider-cache.yml saves it from the base branch, so PRs
      # don't each store their own 3.7 GB copy. A miss downloads from Hugging Face.
      - name: Restore model
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.DECIDER_MODEL }}

      - name: Finish installing strands-decider
        run: |
          while [ ! -f "$RUNNER_TEMP/install.rc" ]; do sleep 1; done
          cat "$RUNNER_TEMP/install.log"
          exit "$(cat "$RUNNER_TEMP/install.rc")"

      - name: Ask the decider about this PR
        env:
          PR_TITLE: ${{ steps.pr.outputs.title }}
          PR_BODY: ${{ steps.pr.outputs.body }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          python .github/decider/ask.py "$RUNNER_TEMP/decider.md"
          cat "$RUNNER_TEMP/decider.md" >> "$GITHUB_STEP_SUMMARY"

      # Fork PRs get a read-only token on pull_request runs, so they only see the
      # job summary; a manual run has a write token and can comment on any PR.
      - name: Comment on the PR
        if: github.event_name == 'workflow_dispatch' || steps.pr.outputs.same_repo == 'true'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require("fs");
            const body = fs.readFileSync(`${process.env.RUNNER_TEMP}/decider.md`, "utf8");
            const { owner, repo } = context.repo;
            const issue_number = Number("${{ steps.pr.outputs.number }}");
            const comments = await github.paginate(github.rest.issues.listComments, { owner, repo, issue_number });
            const mine = comments.find((c) => c.body?.startsWith("<!-- strands-decider -->"));
            if (mine) {
              await github.rest.issues.updateComment({ owner, repo, comment_id: mine.id, body });
            } else {
              await github.rest.issues.createComment({ owner, repo, issue_number, body });
            }
