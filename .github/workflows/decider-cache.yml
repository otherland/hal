name: Decider model cache

# Saves the model cache from this branch so every PR into it can restore it
# (a PR can only restore caches saved on its base or the default branch).
# Weekly runs keep it from expiring; GitHub drops caches unused for 7 days.
on:
  push:
    branches: [python]
    paths: [.github/decider/**, .github/workflows/decider-cache.yml]
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:

permissions:
  contents: read

env:
  DECIDER_MODEL: StrandsAgents/strands-decider-2B-qwen3.5-v1-2610

jobs:
  warm:
    runs-on: ubuntu-latest
    steps:
      - name: Check for the cached model
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.DECIDER_MODEL }}
          lookup-only: true

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: astral-sh/setup-uv@v6

      - name: Download the model
        if: steps.cache.outputs.cache-hit != 'true'
        run: uvx --from huggingface_hub hf download "$DECIDER_MODEL"

      - if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.cache/huggingface
          key: hf-${{ env.DECIDER_MODEL }}
